---
# Drama Processor Windows 原生配置文件
# Windows Native Configuration

# 当前激活的用户配置
active_user: xh-daily

# Basic processing settings
target_fps: 60
smart_fps: true
fast_mode: true
filter_threads: 2
verbose: false

# Duration settings (in seconds)
min_duration: 480.0 # 8 minutes
max_duration: 900.0 # 15 minutes

# Material generation settings
date_str: null

# Start point selection settings
exclude_last_episodes: 8

# Text overlay settings
title_font_size: 36
bottom_font_size: 28
side_font_size: 24
vertical_line_spacing: -10 # 竖排文字行距（负值让文字更紧凑）
footer_text: "剧情纯属虚构 请勿模仿"
side_text: "剧情纯属虚构 请勿模仿"
enable_left_side_text: false
enable_right_side_text: false

title_opacity: 0.9
bottom_opacity: 0.85

# 标题颜色
title_colors:
  - "#00CED1"
  - "#20B2AA"
  - "#48D1CC"
  - "#40E0D0"
  - "#5F9EA0"
  - "#00BFFF"
  - "#1E90FF"
  - "#4169E1"
  - "#32CD32"
  - "#00FA9A"
  - "#7CFC00"
  - "#98FB98"
  - "#3CB371"
  - "#00FF7F"
  - "#90EE90"
  - "#00FF00"
  - "#FFA500"
  - "#FFB347"
  - "#FF8C00"
  - "#FFD700"
  - "#FFA07A"
  - "#FF7F50"
  - "#FFAE42"
  - "#FF69B4"
  - "#FFB6C1"
  - "#FF1493"
  - "#FF00FF"
  - "#DA70D6"
  - "#EE82EE"
  - "#BA55D3"
  - "#9370DB"
  - "#8A2BE2"
  - "#9932CC"
  - "#9400D3"
  - "#FFFF00"
  - "#FFE600"
  - "#FFD580"
  - "#F0E68C"
  - "#FF6347"
  - "#FF4500"
  - "#DC143C"
  - "#FF0000"

# Hook text settings
enable_hook_text: false
hook_texts:
  - "完结撒花"
  - "独家首发"
  - "追剧必看"
  - "热播推荐"
  - "火爆全网"
hook_font_size: 180
hook_duration: 3.0
hook_text_color: "#FFE600"

# Processing behavior
random_start: true
seed: null
use_hardware: true
keep_temp: false
jobs: 1

# Canvas/Resolution settings
canvas: null
reference_resolution: null

# Directory settings (Windows 路径格式)
# 修改为你的实际路径
default_source_dir: "D:\\短剧剪辑\\源素材视频"
backup_source_dir: "E:\\短剧剪辑\\源素材视频"
temp_dir: null # 使用系统临时目录
output_dir: "..\\导出素材"
tail_cache_dir: null # 自动使用系统临时目录
tail_file: "assets\\tail.mp4"
refresh_tail_cache: false

# Font settings (Windows 字体，null 则自动检测)
font_file: null # 自动检测微软雅黑等 Windows 字体

# Watermark settings
watermark_path: "assets\\watermark-xiaohong.png"
enable_watermark: false
enable_brand_text: true
brand_text: "热门短剧"

# Selection settings
include: null
exclude: null
full: false
no_interactive: false

# Video encoding settings
video:
  hw_codec: "auto"
  sw_codec: "libx264"
  bitrate: "6500k"
  max_rate: "6500k"
  buffer_size: "8000k"
  soft_crf: "24"
  preset: "veryfast"
  profile: "high"
  level: "4.2"
  hw_level: "4.2"
  sw_level: "4.1"
  tag: "avc1"
  pixel_format: "yuv420p"
  faststart: false

# Audio encoding settings
audio:
  codec: "aac"
  bitrate: "128k"
  sample_rate: 48000

# 飞书功能配置
enable_feishu_features: false # 默认关闭，由用户配置覆盖
enable_feishu_notification: false
feishu_webhook_url: null

# 飞书API配置（由用户配置提供，这里不设置空字段）
feishu: null

# 飞书轮询配置
feishu_watcher:
  enabled: true
  poll_interval: 1800
  max_dates_per_cycle: 1
  settle_seconds: 120
  settle_rounds: 1
  idle_exit_minutes: null
  state_dir: "history/feishu_watcher"
  date_whitelist: []
  date_blacklist: []
  status_filter: null

# 日期去重设置
date_deduplication:
  enabled: true
  storage_dir: "history/date_dedup"
  skip_processed_by_default: false
