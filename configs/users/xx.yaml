# 用户配置 - xx
# 此文件包含用户专属配置，会覆盖 default.yaml 中的对应字段

# 素材生成设置
count: 5 # 每部剧生成素材数量
material_code: "xx" # 素材文件名标识

# 标题颜色 - 绿色系
title_colors:
  - "#32CD32" # Lime Green
  - "#00FA9A" # Medium Spring Green
  - "#7CFC00" # Lawn Green
  - "#98FB98" # Pale Green
  - "#3CB371" # Medium Sea Green
  - "#00FF7F" # Spring Green

# 目录设置
default_source_dir: "D:\\短剧剪辑\\源素材视频" # WSL 路径
# 临时文件自动使用C盘（性能最优，无需配置）

# 多素材文案配置
brand_text_mapping:
  mode: "range"
  ranges:
    - range: "01-05"
      text: "葸辉看剧"
  cycle_texts:
    - "葸辉看剧"
  default_text: "热门短剧"

# 飞书功能配置
enable_feishu_features: true
feishu:
  table_id: "tblZ46PiVcROlbnu" # 该达人的飞书多维表格 ID（其他配置继承自 default.yaml）
