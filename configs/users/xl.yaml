# 用户配置 - xl
# 此文件包含用户专属配置，会覆盖 default.yaml 中的对应字段

# 素材生成设置
count: 15 # 每部剧生成素材数量
material_code: "xl" # 素材文件名标识

# 标题颜色 - 蓝青色系
title_colors:
  - "#00CED1" # Dark Turquoise
  - "#20B2AA" # Light Sea Green
  - "#48D1CC" # Medium Turquoise
  - "#40E0D0" # Turquoise
  - "#5F9EA0" # Cadet Blue
  - "#00BFFF" # Deep Sky Blue

# 目录设置
default_source_dir: "E:\\短剧剪辑\\源素材视频" # Windows 路径
output_dir: "E:\\短剧剪辑\\输出素材" # 输出目录

# 存储类型配置（自动性能优化）
storage_type: "hdd"  # 可选: "ssd" 或 "hdd"
# - ssd: 所有操作都在同一SSD上（最快，适合固态硬盘）
# - hdd: 临时文件使用系统盘SSD，最终输出到HDD（平衡性能和容量）

# 多素材文案配置
brand_text_mapping:
  mode: "range"
  ranges:
    - range: "01-05"
      text: "茹悟好剧"
    - range: "06-10"
      text: "听燕剧场"
    - range: "11-15"
      text: "小来追剧"
  cycle_texts:
    - "茹悟好剧"
    - "听燕剧场"
    - "小来追剧"
  default_text: "热门短剧"

# 飞书功能配置
enable_feishu_features: true
feishu:
  table_id: "tblU2gdZSltbN5Bt" # 该达人的飞书多维表格 ID（其他配置继承自 default.yaml）
enable_brand_text: true # 启用品牌文字（底部第一行）
enable_disclaimer_text: true # 启用免责声明（底部第二行）
