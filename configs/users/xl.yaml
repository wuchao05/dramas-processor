# 用户配置 - xl
# 此文件包含用户专属配置，会覆盖 default.yaml 中的对应字段

# 素材生成设置
count: 10 # 每部剧生成素材数量
material_code: "xl" # 素材文件名标识

# 标题颜色 - 蓝青色系
title_colors:
  - "#00CED1" # Dark Turquoise
  - "#20B2AA" # Light Sea Green
  - "#48D1CC" # Medium Turquoise
  - "#40E0D0" # Turquoise
  - "#5F9EA0" # Cadet Blue
  - "#00BFFF" # Deep Sky Blue

# 目录设置
default_source_dir: "/mnt/e/短剧剪辑/源素材视频" # WSL 路径

# 多素材文案配置
brand_text_mapping:
  mode: "range"
  ranges:
    - range: "01-05"
      text: "茹悟好剧"
    - range: "06-10"
      text: "浮生剧场"
  cycle_texts:
    - "茹悟好剧"
    - "浮生剧场"
  default_text: "热门短剧"

# 飞书功能配置（核心字段）
enable_feishu_features: true # 飞书功能总开关
feishu:
  app_id: "cli_a870f7611b7b1013"
  app_secret: "NTwHbZG8rpOQyMEnXGPV6cNQ84KEqE8z"
  app_token: "WdWvbGUXXaokk8sAS94c00IZnsf"
