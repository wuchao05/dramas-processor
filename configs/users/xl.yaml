# 用户配置 - xl
# 此文件包含用户专属配置，会覆盖 default.yaml 中的对应字段

# 素材生成设置
count: 15 # 每部剧生成素材数量
material_code: "xl" # 素材文件名标识

# 标题颜色 - 蓝青色系
title_colors:
  - "#00CED1" # Dark Turquoise
  - "#20B2AA" # Light Sea Green
  - "#48D1CC" # Medium Turquoise
  - "#40E0D0" # Turquoise
  - "#5F9EA0" # Cadet Blue
  - "#00BFFF" # Deep Sky Blue

# 目录设置
default_source_dir: "E:\\短剧剪辑\\源素材视频" # Windows 路径
output_dir: "E:\\短剧剪辑\\输出素材" # 输出目录（必须设置为与源素材同一盘）

# 多素材文案配置
brand_text_mapping:
  mode: "range"
  ranges:
    - range: "01-05"
      text: "茹悟好剧"
    - range: "06-10"
      text: "小来追剧"
    - range: "11-15"
      text: "听燕剧场"
  cycle_texts:
    - "茹悟好剧"
    - "小来追剧"
    - "听燕剧场"
  default_text: "热门短剧"

# 飞书功能配置
enable_feishu_features: true
feishu:
  table_id: "tblU2gdZSltbN5Bt" # 该达人的飞书多维表格 ID（其他配置继承自 default.yaml）
