title_colors:
  - "#FFFFFF"

# 目录设置
default_source_dir: "/mnt/d/短剧剪辑/源素材视频" # WSL 路径

# 多素材文案配置
brand_text_mapping:
  mode: "range"
  ranges:
    # - range: "01-03"
    #   text: "斯娜看剧"
    - range: "01-04"
      text: "葸辉好剧"
    - range: "05-08"
      text: "葸辉爆剧"
    - range: "09-12"
      text: "斯娜看剧"
    - range: "13-16"
      text: "小红看剧"
    # - range: "15"
    #   text: "萍通剧坊"
    # - range: "16"
    #   text: "看家本领"
    # - range: "17"
    #   text: "清妍短剧"
    - range: "17-20"
      text: "哈哈看剧"

  cycle_texts:
    - "葸辉好剧"
    - "葸辉爆剧"
    - "斯娜看剧"
    - "小红看剧"
    # - "萍通剧坊"
    # - "看家本领"
    # - "清妍短剧"
    - "哈哈看剧"
  default_text: "热门短剧"

# 飞书功能配置（核心字段）
enable_feishu_features: true # 飞书功能总开关
feishu:
  app_id: "cli_a870f7611b7b1013"
  app_secret: "NTwHbZG8rpOQyMEnXGPV6cNQ84KEqE8z"
  app_token: "WdWvbGUXXaokk8sAS94c00IZnsf"
  table_id: "tblDOyi2Lzs80sv0"
# 其他飞书配置（webhook、轮询、详细参数等）已在 default.yaml 中设置默认值

# 钩子文案配置（开头吸引眼球的大字）
enable_hook_text: false # 启用钩子文案
hook_texts:
  - "完结撒花"
  - "独家首发"
  - "全网首发"
  - "追剧必看"
  - "热播推荐"
  - "火爆全网"
  - "全集已更新"
  - "大结局来了"

hook_font_size:
  150
  #   text: "萍通剧坊"
  # - range: "04-06"
  #   text: "葸辉爆剧"
  # - range: "07-09"
  #   text: "清妍短剧"
  # - range: "10-13"
  #   text: "看家本领"
  # - range: "14-18"
  #   text: "葸辉好剧"
  # - range: "19-21"
  #   text: "小红看剧"
  # - range: "22-24"
hook_duration: 3.0
hook_text_color: "#FFE600"
hook_border_color: "#000000"

# NVENC 硬件编码优化配置（针对 RTX 2060）
# ⚠️ 重要：避免内存错误
video:
  hw_codec: "h264_nvenc"
  # bitrate: "5000k"      # 降低码率避免显存不足
  # max_rate: "5500k"
  # buffer_size: "6000k"  # 降低 buffer size
  # preset: "p1"          # 最快 preset，减少 GPU 负担
  # profile: "main"       # main 比 high 占用更少资源
  level: "4.1"
  bitrate: "6500k"
  max_rate: "7000k"
  buffer_size: "9000k"
  preset: "p4"
  profile: "high"
