# 用户配置 - xh（小红，管理员）
# 此文件包含用户专属配置，会覆盖 default.yaml 中的对应字段

# 素材生成设置
count: 24 # 每部剧生成素材数量
material_code: 'xh' # 素材文件名标识

# 标题颜色
title_colors:
  - '#FFA500' # Orange
  - '#FFB347' # Light Orange
  - '#FF8C00' # Dark Orange
  - '#FFD580' # Peach
  - '#E69500' # Earth Orange
  - '#FFAE42' # Bright Orange

# 目录设置
default_source_dir: '/mnt/d/短剧剪辑/源素材视频' # WSL 路径

# 多素材文案配置
brand_text_mapping:
  mode: 'range'
  ranges:
    - range: '01-03'
      text: '萍通剧坊'
    - range: '04-06'
      text: '哈哈看剧'
    - range: '07-09'
      text: '清妍短剧'
    - range: '10-13'
      text: '看家本领'
    - range: '14-18'
      text: '葸辉好剧'
    - range: '19-21'
      text: '小红看剧'
    - range: '22-24'
      text: '斯娜看剧'

  cycle_texts:
    - '萍通剧坊'
    - '哈哈看剧'
    - '清妍短剧'
    - '看家本领'
    - '葸辉好剧'
    - '小红看剧'
    - '斯娜看剧'
  default_text: '热门短剧'

