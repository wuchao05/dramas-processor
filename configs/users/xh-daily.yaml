# 用户配置 - xh（小红，管理员）
# 此文件包含用户专属配置，会覆盖 default.yaml 中的对应字段

# 素材生成设置
count: 40 # 每部剧生成素材数量
material_code: "xh" # 素材文件名标识

# 标题颜色
title_colors:
  - "#32CD32" # Lime Green
  - "#00FA9A" # Medium Spring Green
  - "#7CFC00" # Lawn Green
  - "#98FB98" # Pale Green
  - "#3CB371" # Medium Sea Green
  - "#00FF7F" # Spring Green

# 目录设置
default_source_dir: "/mnt/d/短剧剪辑/源素材视频" # WSL 路径
temp_dir: "/home/drama_temp" # 临时目录（使用 WSL 原生文件系统，快且空间大）
tail_cache_dir: "/home/tails_cache" # 尾部缓存目录（使用 WSL 原生文件系统）

# 多素材文案配置
brand_text_mapping:
  mode: ""
  ranges:
    - range: "01-06"
      text: "葸辉好剧"
    - range: "07-12"
      text: "小红看剧"
    - range: "13-18"
      text: "斯娜看剧"
  cycle_texts:
    - "葸辉好剧"
    - "小红看剧"
    - "斯娜看剧"
  default_text: "天天看好剧"

  # 钩子文案配置（关闭以提升性能）
enable_hook_text: true # 关闭钩子文案
enable_left_side_text: false # 关闭左侧品牌文案
enable_right_side_text: false # 关闭右侧文案

# 飞书功能配置（核心字段）
enable_feishu_features: true # 飞书功能总开关
feishu:
