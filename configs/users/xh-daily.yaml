# 用户配置 - xh（小红，管理员）- 日常任务版
# 只包含用户专属配置，其他字段继承自 default.yaml

# 素材生成设置
count: 20 # 每部剧生成素材数量
material_code: "xh" # 素材文件名标识

# 目录设置（Windows 格式）
default_source_dir: "D:\\短剧剪辑\\源素材视频"

# 字体设置（使用 Windows 自带字体）
# 使用 null 让程序自动检测（会优先 TTF 文件，避免 TTC 兼容性问题）
font_file: null

# 竖排文字行间距（正值=增大间距，负值=减小间距，0=默认）
vertical_line_spacing: 0

# 多素材文案配置
brand_text_mapping:
  mode: "range"
  ranges:
    - range: "01-06"
      text: "斯娜看剧"
    - range: "07-10"
      text: "小红看剧"
    - range: "11-15"
      text: "哈哈看剧"
    - range: "16-17"
      text: "萍通剧坊"
    - range: "18-20"
      text: "看家本领"

  cycle_texts:
    - "斯娜看剧"
    - "小红看剧"
    - "哈哈看剧"
    - "萍通剧坊"
    - "看家本领"
  default_text: "天天看好剧"

# 飞书功能配置
enable_feishu_features: true
enable_feishu_notification: false

feishu:
  app_id: "cli_a870f7611b7b1013"
  app_secret: "NTwHbZG8rpOQyMEnXGPV6cNQ84KEqE8z"
  app_token: "WdWvbGUXXaokk8sAS94c00IZnsf"
  table_id: "tblJcLhLpEkmFkga"
  base_url: "https://open.feishu.cn/open-apis/bitable/v1"
  field_names: ["剧名", "账户", "日期", "搭建时间", "主体"]
  status_field_name: "当前状态"
  pending_status_value: "待剪辑"
  processing_status_value: "剪辑中"
  completed_status_value: "待上传"
  missing_source_status_value: "无源视频"
  rating_field_name: "评级" # 评级字段名（用于优先级排序）
  priority_rating_value: "红标" # 高优先级评级值（同日期内最优先处理）
  upload_time_sort_desc: false # xh-daily: 上架时间升序，早上架的先处理
  page_size: 200
  token_refresh_interval: 7200000

# 飞书轮询配置
feishu_watcher:
  enabled: true
  poll_interval: 1800
  max_dates_per_cycle: 1
  settle_seconds: 120
  settle_rounds: 1
  idle_exit_minutes: null
  state_dir: "history/feishu_watcher"
  date_whitelist: []
  date_blacklist: []
  status_filter: null

# 文案显示配置
enable_hook_text: false
enable_brand_text: true  # 启用品牌文字（底部第一行）
enable_disclaimer_text: true  # 启用免责声明（底部第二行）
