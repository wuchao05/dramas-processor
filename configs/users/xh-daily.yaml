      text: "斯娜看剧"
    - range: "07-12"
      text: "小红看剧"
    - range: "13-17"
      text: "清妍短剧"
    - range: "18-21"
      text: "葸辉爆剧"
    - range: "22-25"
      text: "哈哈看剧"
    - range: "26-28"
      text: "萍通剧坊"
    - range: "29-30"
      text: "葸辉好剧"
    - range: "31-32"
      text: "看家本领"
    - range: "33-34"
      text: "奈煊剧场"
    - range: "35-37"
      text: "婉纨好剧"
    - range: "38-40"
      text: "葸辉剧场"

  cycle_texts:
    - "斯娜看剧"
    - "小红看剧"
    - "清妍短剧"
    - "葸辉爆剧"
    - "哈哈看剧"
    - "萍通剧坊"
    - "葸辉好剧"
    - "看家本领"
    - "奈煊剧场"
    - "婉纨好剧"
