# 飞书功能配置（核心字段）
enable_feishu_features: true # 飞书功能总开关
feishu:
  app_id: "cli_a870f7611b7b1013"
  app_secret: "NTwHbZG8rpOQyMEnXGPV6cNQ84KEqE8z"
  app_token: "WdWvbGUXXaokk8sAS94c00IZnsf"
  table_id: "tblDOyi2Lzs80sv0"
# 其他飞书配置（webhook、轮询、详细参数等）已在 default.yaml 中设置默认值

# NVENC 硬件编码优化配置（针对 RTX 2060 性能优化）
video:
  hw_codec: "h264_nvenc"
  level: "4.1"
  bitrate: "5000k" # 降低码率避免显存不足，同时提升速度
  max_rate: "5500k"
  buffer_size: "6000k" # 降低 buffer size
  preset: "p1" # 最快 preset，减少 GPU 负担（p4 → p1 可提升 20-30% 速度）
  profile: "main" # main 比 high 占用更少资源

# 性能优化配置
target_fps: 25 # 降低帧率（60fps → 25fps 可节省约 60% 编码时间）
filter_threads: 2 # 降低滤镜线程数（文字叠加不需要太多线程）

# 关闭非必要滤镜
enable_hook_text: false # 关闭钩子文案
enable_left_side_text: false # 关闭左侧品牌文案
enable_right_side_text: false # 关闭右侧文案
