---
# Drama Processor Windows 原生配置文件
# Windows Native Configuration

# 当前激活的用户配置
active_user: xh-daily

# Basic processing settings
target_fps: 60
smart_fps: true
fast_mode: true
filter_threads: 2
verbose: false

# Duration settings (in seconds)
min_duration: 480.0 # 8 minutes
max_duration: 900.0 # 15 minutes

# Material generation settings
date_str: null

# Start point selection settings
exclude_last_episodes: 8

# Text overlay settings
title_font_size: 36  # 顶部标题字号
brand_font_size: 28  # 品牌文字字号（底部第一行）
disclaimer_font_size: 28  # 免责声明字号（底部第二行）
disclaimer_text: "剧情纯属虚构 请勿模仿"  # 免责声明文字（底部第二行）
enable_brand_text: false  # 启用品牌文字（底部第一行）
enable_disclaimer_text: false  # 启用免责声明（底部第二行）

title_opacity: 0.9
bottom_opacity: 0.85

# 标题颜色
title_colors:
  - "#00CED1"
  - "#20B2AA"
  - "#48D1CC"
  - "#40E0D0"
  - "#5F9EA0"
  - "#00BFFF"
  - "#1E90FF"
  - "#4169E1"
  - "#32CD32"
  - "#00FA9A"
  - "#7CFC00"
  - "#98FB98"
  - "#3CB371"
  - "#00FF7F"
  - "#90EE90"
  - "#00FF00"
  - "#FFA500"
  - "#FFB347"
  - "#FF8C00"
  - "#FFD700"
  - "#FFA07A"
  - "#FF7F50"
  - "#FFAE42"
  - "#FF69B4"
  - "#FFB6C1"
  - "#FF1493"
  - "#FF00FF"
  - "#DA70D6"
  - "#EE82EE"
  - "#BA55D3"
  - "#9370DB"
  - "#8A2BE2"
  - "#9932CC"
  - "#9400D3"
  - "#FFFF00"
  - "#FFE600"
  - "#FFD580"
  - "#F0E68C"
  - "#FF6347"
  - "#FF4500"
  - "#DC143C"
  - "#FF0000"

# Hook text settings
enable_hook_text: false
hook_texts:
  - "完结撒花"
  - "独家首发"
  - "追剧必看"
  - "热播推荐"
  - "火爆全网"
hook_font_size: 180
hook_duration: 3.0
hook_text_color: "#FFE600"

# Processing behavior
random_start: true
seed: null
use_hardware: true
keep_temp: false
jobs: 1

# Canvas/Resolution settings
canvas: null
reference_resolution: null

# Directory settings (Windows 路径格式)
# 修改为你的实际路径
default_source_dir: "D:\\短剧剪辑\\源素材视频"
backup_source_dir: "E:\\短剧剪辑\\源素材视频"
temp_dir: null # 使用系统临时目录
output_dir: "..\\导出素材"
tail_cache_dir: null # 自动使用系统临时目录
tail_file: "assets\\tail.mp4"
refresh_tail_cache: false

# Font settings (Windows 字体，null 则自动检测)
font_file: null # 自动检测微软雅黑等 Windows 字体

# Watermark settings
watermark_path: "assets\\watermark-xiaohong.png"
enable_watermark: false
enable_brand_text: true
brand_text: "热门短剧"

# Selection settings
include: null
exclude: null
full: false
no_interactive: false

# Video encoding settings
video:
  hw_codec: "auto"
  sw_codec: "libx264"
  bitrate: "6500k"
  max_rate: "6500k"
  buffer_size: "8000k"
  soft_crf: "24"
  preset: "veryfast"
  profile: "high"
  level: "4.2"
  hw_level: "4.2"
  sw_level: "4.1"
  tag: "avc1"
  pixel_format: "yuv420p"
  faststart: false

# Audio encoding settings
audio:
  codec: "aac"
  bitrate: "128k"
  sample_rate: 48000

# 飞书功能配置
enable_feishu_features: false # 默认关闭，由用户配置覆盖
enable_feishu_notification: false
feishu_webhook_url: null

# 飞书API配置（公共配置，用户只需覆盖 table_id）
feishu:
  # 飞书应用凭证（所有用户共用）
  app_id: "cli_a870f7611b7b1013"
  app_secret: "NTwHbZG8rpOQyMEnXGPV6cNQ84KEqE8z"
  app_token: "WdWvbGUXXaokk8sAS94c00IZnsf"
  
  # 多维表格配置（每个达人不同，需在用户配置中覆盖）
  table_id: null  # 必须在用户配置中指定
  
  # 飞书 API 端点
  base_url: "https://open.feishu.cn/open-apis/bitable/v1"
  
  # 字段名称配置（所有用户共用）
  field_names: ["剧名", "账户", "日期", "搭建时间", "主体"]
  status_field_name: "当前状态"
  pending_status_value: "待剪辑"
  processing_status_value: "剪辑中"
  completed_status_value: "待上传"
  missing_source_status_value: "无源视频"
  
  # 评级优先级配置（仅 xh-daily 使用）
  rating_field_name: "评级"
  priority_rating_value: "红标"
  upload_time_sort_desc: true

# 飞书轮询配置
feishu_watcher:
  enabled: true
  poll_interval: 1800
  max_dates_per_cycle: 1
  settle_seconds: 120
  settle_rounds: 1
  idle_exit_minutes: null
  state_dir: "history/feishu_watcher"
  date_whitelist: []
  date_blacklist: []
  status_filter: null

# 日期去重设置
date_deduplication:
  enabled: true
  storage_dir: "history/date_dedup"
  skip_processed_by_default: false
